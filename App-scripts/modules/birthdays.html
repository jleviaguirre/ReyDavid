<div id="birthdays-app" class="bday-wrap">
  <style>
    .bday-wrap { max-width: 640px; margin: 0 auto; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .bday-card { background: #fff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.12); overflow: hidden; }
    .bday-header { background: #003366; color: #fff; padding: 22px 24px; border-bottom: 4px solid #d4af37; }
    .bday-header h1 { margin: 0; font-size: 1.4em; }
    .bday-body { padding: 10px 24px 24px; }
    .bday-month { margin-top: 22px; border-radius: 12px; overflow: hidden; border: 1px solid #eef2f6; }
    .bday-month.current { border: 2px solid #d4af37; box-shadow: 0 4px 14px rgba(212,175,55,0.25); }
    .bday-month-header { padding: 12px 16px; background: #eef4fa; color: #003366; font-weight: bold; font-size: 0.95em; display: flex; align-items: center; justify-content: space-between; }
    .bday-month.current .bday-month-header { background: #003366; color: #fff; }
    .bday-badge { font-size: 0.75em; background: #d4af37; color: #003366; padding: 2px 10px; border-radius: 12px; font-weight: bold; }
    .bday-list { list-style: none; margin: 0; padding: 0; }
    .bday-list li { padding: 10px 16px; border-top: 1px solid #eef2f6; display: flex; align-items: center; justify-content: space-between; }
    .bday-person { font-weight: bold; color: #1e293b; }
    .bday-day { color: #64748b; font-size: 0.9em; }
    .bday-loading, .bday-empty { text-align: center; padding: 40px 20px; color: #64748b; }
  </style>

  <div class="bday-card">
    <div class="bday-header"><h1>🎂 Cumpleaños</h1></div>
    <div id="bday-body" class="bday-body">
      <div class="bday-loading">Cargando…</div>
    </div>
  </div>
</div>

<script>
(function () {
  const bodyEl = document.getElementById('birthdays-app').querySelector('#bday-body');
  const MONTH_NAMES_ES = {
    Jan: 'Enero', Feb: 'Febrero', Mar: 'Marzo', Apr: 'Abril', May: 'Mayo', Jun: 'Junio',
    Jul: 'Julio', Aug: 'Agosto', Sep: 'Septiembre', Oct: 'Octubre', Nov: 'Noviembre', Dec: 'Diciembre'
  };

  // Uses the browser's own escaping instead of a hand-typed entity map, so pasting this into a
  // Google Sheets cell can't get corrupted by Sheets' smart-quote autocorrect.
  function esc(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function renderGroups(groups) {
    const nonEmpty = groups.filter(function (g) { return g.people.length > 0; });
    if (!nonEmpty.length) {
      bodyEl.innerHTML = '<div class="bday-empty">Nadie ha compartido su cumpleaños todavía.</div>';
      return;
    }

    bodyEl.innerHTML = nonEmpty.map(function (group) {
      const monthLabel = MONTH_NAMES_ES[group.monthName] || group.monthName;
      const peopleHtml = group.people.map(function (p) {
        const fullName = [p.name, p.lastname].filter(Boolean).join(' ');
        return '<li><span class="bday-person">' + esc(fullName) + '</span><span class="bday-day">' + String(p.day).padStart(2, '0') + '</span></li>';
      }).join('');

      return (
        '<div class="bday-month' + (group.isCurrentMonth ? ' current' : '') + '">' +
          '<div class="bday-month-header"><span>' + esc(monthLabel) + '</span>' +
          (group.isCurrentMonth ? '<span class="bday-badge">Este mes</span>' : '') +
          '</div>' +
          '<ul class="bday-list">' + peopleHtml + '</ul>' +
        '</div>'
      );
    }).join('');
  }

  (async function init() {
    try {
      const resp = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'getBirthdays' }) });
      const data = await resp.json();
      if (data.status !== 'success') {
        bodyEl.innerHTML = '<div class="bday-empty">' + esc(data.message || 'No se pudo cargar la lista.') + '</div>';
        return;
      }
      renderGroups(data.groups || []);
    } catch (err) {
      bodyEl.innerHTML = '<div class="bday-empty">Error de red al cargar los cumpleaños.</div>';
    }
  })();
})();
</script>
