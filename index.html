<div class="lang-toggle-container translate-ignore">
    <div id="lang-es" class="lang-btn active" onclick="switchLang('es')">ESP</div>
    <div id="lang-en" class="lang-btn" onclick="switchLang('en')">ENG</div>
</div>

<div id="google_translate_element" style="display:none;"></div>

        new google.translate.TranslateElement({
            pageLanguage: 'es',

</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script src="app.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(registration => console.log('ServiceWorker registered with scope:', registration.scope))
            .catch(err => console.error('ServiceWorker registration failed:', err));
        });
      }
    </script>


<script>
    // 1. Al cargar la página, revisamos en qué idioma estamos
    window.addEventListener('DOMContentLoaded', () => {
        const isEnglish = document.cookie.includes('googtrans=/es/en');
        if (isEnglish) {
            document.getElementById('lang-en').classList.add('active');
            document.getElementById('lang-es').classList.remove('active');
        } else {
            document.getElementById('lang-es').classList.add('active');
            document.getElementById('lang-en').classList.remove('active');
        }
    });

    // 2. Función que se ejecuta al hacer clic en ESP o ENG
    function switchLang(lang) {
        const domain = window.location.hostname;
        
        if (lang === 'en') {
            // Guardar instrucción de traducir al inglés
            document.cookie = "googtrans=/es/en; path=/";
            if (domain) document.cookie = `googtrans=/es/en; domain=${domain}; path=/`;
        } else {
            // Borrar instrucción para que regrese a su español nativo
            document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            if (domain) document.cookie = `googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=${domain}; path=/;`;
            
            document.cookie = "googtrans=/es/es; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            if (domain) document.cookie = `googtrans=/es/es; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=${domain}; path=/;`;
        }
        
        // Recargar la pantalla suavemente para que Google traduzca TODO
        window.location.reload();
    }
</script>

</body>
