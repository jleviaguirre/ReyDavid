<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey David Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Rey David</div>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <nav id="main-nav">
            <ul id="menu-items">
                <li><a onclick="showPage('home')">Home</a></li>
                <li id="nav-login"><a onclick="showPage('login')">Login</a></li>
                <li id="nav-settings" style="display: none;"><a onclick="showPage('settings')">Settings</a></li>
                <li id="nav-logout" style="display: none;"><a onclick="logout()">Logout</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div id="page-home">
            <h1 id="welcome-msg">Welcome to Rey David</h1>
            <div id="home-tiles" class="tile-grid">
                <p>Loading content...</p>
            </div>
        </div>

        <div id="page-login" style="display: none;">
            <h2>Access Private Area</h2>
            <p>Enter your email to receive a secure login link.</p>
            <input type="email" id="user-email" placeholder="your@email.com">
            <button onclick="requestMagicLink()">Send Login Link</button>
            <p id="login-message" style="font-weight: bold; margin-top: 10px;"></p>
        </div>

        <div id="page-settings" style="display: none;">
            <h2 id="welcome-user">My Profile Settings</h2>
            <p>Update your preferences below.</p>
            
            <form id="settings-form" onsubmit="saveSettings(event)">
                <label>First Name:</label>
                <input type="text" id="set-names">
                
                <label>Last Name:</label>
                <input type="text" id="set-lastnames">
                
                <label>Phone Number:</label>
                <input type="tel" id="set-phone">
                
                <label>Birthday:</label>
                <input type="date" id="set-birthday">
                
                <hr style="margin: 20px 0;">
                <h3>Preferences</h3>
                
                <label><input type="checkbox" id="set-david_list"> Join David List</label><br>
                <label><input type="checkbox" id="set-david_connection"> David Connection</label><br>
                <label><input type="checkbox" id="set-david_outreach"> David Outreach</label><br>
                <label><input type="checkbox" id="set-host_meeting"> Host Monthly Meeting</label><br>
                <label><input type="checkbox" id="set-birthday_list"> Birthday List</label><br>
                
                <button type="submit" style="margin-top: 20px; background: #28a745;">Save Settings</button>
                <p id="save-message" style="font-weight: bold; margin-top: 10px;"></p>
            </form>
            
            <button onclick="logout()" style="background: #cc0000; margin-top: 40px;">Logout</button>
        </div>
    </div>
<script src="app.js"></script>
    
</body>
</html>
