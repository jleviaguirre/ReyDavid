<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rey David Portal</title>
    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rey David">
    <link rel="apple-touch-icon" href="icon-192.png">
    
</head>

<body>
    <header>
    <a href="#home" class="logo" style="display: flex; align-items: center; text-decoration: none; padding-left: 10px;">
        <svg viewBox="0 0 500 190" style="height: 40px; width: auto;" xmlns="http://www.w3.org/2000/svg">
            <rect width="500" height="190" fill="#0087cb" />
            <text x="250" y="45" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
                Grupo Católico
            </text>
            <text x="250" y="125" font-family="'Times New Roman', Times, serif" font-size="95" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
                Rey David
            </text>
            <polygon points="230,175 470,175 485,140 245,140" fill="#005989" />
            <text x="357" y="165" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#ffffff" text-anchor="middle">
                La verdad primero
            </text>
        </svg>
    </a>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <nav id="main-nav">
            <ul id="menu-items"></ul>
        </nav>
    </header>

    <div id="main-container" class="container">
        <div id="page-dynamic" style="display: none;"></div>
        <footer style="padding: 20px; text-align: center; font-size: 0.8em;">&copy; 2026 Rey David. All rights reserved.</footer>
    </div> 
    
    <nav id="bottom-app-nav" class="bottom-nav"></nav>
    

    <script src="app.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(registration => console.log('ServiceWorker registered with scope:', registration.scope))
            .catch(err => console.error('ServiceWorker registration failed:', err));
        });
      }
    </script>

</body>
    
</html>
